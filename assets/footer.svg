<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pixel art cyberpunk footer</title>
  <desc id="desc">A neon pixel art desk at sunset with books, a coding mug, plant, laptop, sleeping cat, lamp and pixel border.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171039"/><stop offset="1" stop-color="#09091b"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#fa5dba"/><stop offset=".55" stop-color="#a642c9"/><stop offset="1" stop-color="#472783"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#21174a"/><stop offset="1" stop-color="#10132e"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="pixels" width="32" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f53fba"/><rect x="16" width="8" height="16" fill="#9a50ec"/><rect x="24" width="8" height="16" fill="#24d9ed"/></pattern>
  </defs>
  <!-- night sky and distant pixel stars -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g fill="#b88aff"><rect x="45" y="34" width="4" height="4"/><rect x="118" y="68" width="4" height="4"/><rect x="260" y="27" width="4" height="4"/><rect x="390" y="56" width="4" height="4"/><rect x="809" y="34" width="4" height="4"/><rect x="1036" y="60" width="4" height="4"/><rect x="1140" y="28" width="4" height="4"/></g>
  <!-- sunset window -->
  <g shape-rendering="crispEdges">
    <rect x="445" y="27" width="310" height="148" fill="#301d60" stroke="#26dff0" stroke-width="3"/>
    <rect x="454" y="36" width="292" height="130" fill="url(#sky)"/>
    <rect x="454" y="105" width="292" height="61" fill="#38245f" opacity=".5"/>
    <circle cx="600" cy="91" r="31" fill="#ffb1c6"/>
    <rect x="454" y="120" width="292" height="4" fill="#ff7fd2" opacity=".8"/>
    <path d="M454 148h26v-26h18v16h16v-34h24v29h16v-21h17v36h21v-46h26v35h17v-25h24v36h18v-30h23v30h46v17H454z" fill="#241744"/>
    <path d="M600 36v130M454 101h292" stroke="#2ce6f1" stroke-width="3" opacity=".75"/>
    <rect x="438" y="20" width="324" height="8" fill="#ea4fb9"/><rect x="438" y="175" width="324" height="8" fill="#ea4fb9"/>
  </g>
  <!-- left shelf -->
  <g shape-rendering="crispEdges">
    <rect x="40" y="78" width="245" height="8" fill="#a34ce3"/><rect x="52" y="86" width="8" height="64" fill="#452267"/><rect x="266" y="86" width="8" height="64" fill="#452267"/>
    <rect x="70" y="48" width="24" height="30" fill="#21d9eb"/><rect x="74" y="54" width="16" height="3" fill="#122044"/><rect x="100" y="58" width="20" height="20" fill="#f553b7"/><rect x="124" y="43" width="25" height="35" fill="#7744c9"/><rect x="129" y="51" width="15" height="3" fill="#ff9ad8"/>
    <rect x="169" y="59" width="37" height="19" fill="#202146" stroke="#31dfee" stroke-width="2"/><rect x="175" y="64" width="25" height="3" fill="#f25bbc"/>
    <rect x="59" y="151" width="210" height="7" fill="#a34ce3"/>
    <rect x="74" y="117" width="19" height="33" fill="#f054b8"/><rect x="97" y="108" width="24" height="42" fill="#413179"/><rect x="125" y="122" width="18" height="28" fill="#24d9ed"/><rect x="149" y="112" width="28" height="38" fill="#8c49d5"/>
  </g>
  <!-- right shelves -->
  <g shape-rendering="crispEdges">
    <rect x="916" y="77" width="243" height="8" fill="#a34ce3"/><rect x="927" y="85" width="8" height="69" fill="#452267"/><rect x="1140" y="85" width="8" height="69" fill="#452267"/>
    <rect x="954" y="47" width="23" height="30" fill="#f153b8"/><rect x="982" y="56" width="18" height="21" fill="#24d9ed"/><rect x="1005" y="42" width="28" height="35" fill="#7543c3"/><rect x="1010" y="50" width="17" height="3" fill="#ff91d7"/>
    <rect x="1066" y="49" width="41" height="28" fill="#191735" stroke="#23d9ec" stroke-width="2"/><path d="M1074 59l7 5-7 5m12 0h12" fill="none" stroke="#f34eb7" stroke-width="2"/>
    <rect x="930" y="154" width="210" height="7" fill="#a34ce3"/><rect x="948" y="121" width="20" height="33" fill="#28dced"/><rect x="972" y="112" width="26" height="42" fill="#f153b8"/><rect x="1002" y="126" width="20" height="28" fill="#7141bf"/><rect x="1027" y="116" width="29" height="38" fill="#33205b" stroke="#cb53d8" stroke-width="2"/>
  </g>
  <!-- title, with understated neon framing -->
  <!-- desk plane -->
  <g shape-rendering="crispEdges">
    <rect x="0" y="270" width="1200" height="7" fill="#ef50bf"/><rect x="0" y="277" width="1200" height="61" fill="#17102f"/>
    <path d="M0 282h1200" stroke="#583077" stroke-width="2"/>
    <!-- coding mug -->
    <rect x="322" y="237" width="48" height="37" fill="#281b4c" stroke="#27dff0" stroke-width="3"/><path d="M370 245h10v20h-10" fill="none" stroke="#27dff0" stroke-width="4"/><path d="M333 248l6 6-6 6m12 0h10" fill="none" stroke="#ff5ac6" stroke-width="2"/>
    <!-- stacked books -->
    <rect x="217" y="257" width="91" height="15" fill="#633d9e"/><rect x="226" y="247" width="77" height="10" fill="#f24fb9"/><rect x="235" y="238" width="68" height="9" fill="#24d9ed"/><path d="M227 263h70m-62-11h58" stroke="#f5c5ff" stroke-width="2" opacity=".6"/>
    <!-- leafy pixel plant -->
    <rect x="101" y="247" width="38" height="25" fill="#ea4fb8"/><rect x="106" y="242" width="28" height="5" fill="#ff9edb"/><path d="M120 242v-36m0 22l-14-13m14 5l15-16m-15 32l-15-7" stroke="#49e6ce" stroke-width="4" fill="none"/><rect x="100" y="207" width="10" height="9" fill="#4de2ca"/><rect x="133" y="196" width="11" height="10" fill="#25dce5"/><rect x="99" y="220" width="12" height="8" fill="#8b55e9"/><rect x="132" y="215" width="10" height="8" fill="#4de2ca"/>
    <!-- laptop base and display -->
    <rect x="439" y="231" width="322" height="39" rx="4" fill="#292047" stroke="#29dfee" stroke-width="3"/><rect x="449" y="240" width="302" height="25" fill="url(#screen)"/>
    <path d="M470 248h28m-28 6h40m-40 6h20m12-12h14m-14 6h22" stroke="#ff5ac8" stroke-width="2"/><path d="M555 246h69m-69 7h91m-91 7h54" stroke="#44e9e9" stroke-width="2" opacity=".8"/><rect x="753" y="232" width="25" height="33" fill="#302653" stroke="#29dfee" stroke-width="2"/><rect x="570" y="274" width="40" height="4" fill="#28dff0"/>
    <!-- sleeping pixel cat -->
    <path d="M820 263v-19h9v-10h12v9h26v-9h12v10h10v18h-9v8h-52v-7z" fill="#cbb7ee"/><rect x="827" y="246" width="10" height="3" fill="#221a3d"/><rect x="857" y="246" width="10" height="3" fill="#221a3d"/><path d="M839 255q8 6 16 0" fill="none" stroke="#875aaf" stroke-width="2"/><path d="M815 251h-13m13 6h-10m75-6h12m-12 6h10" stroke="#f28ecf" stroke-width="2"/>
    <!-- angled pixel lamp -->
    <path d="M1068 269h78m-39 0v-46l-25-24m25 24l27-15" fill="none" stroke="#28dfee" stroke-width="5"/><path d="M1055 196h46l14 19h-73z" fill="#ea50bc" stroke="#ff9ade" stroke-width="3"/><path d="M1065 218l-12 23h64l-13-23" fill="#f5c24d" opacity=".17"/>
  </g>
  <!-- glowing desk edge and pixel rainbow footer -->
  <rect x="0" y="269" width="1200" height="2" fill="#27e5f2" filter="url(#glow)"/>
  <rect x="0" y="338" width="1200" height="22" fill="url(#pixels)"/>
  <rect x="0" y="338" width="1200" height="2" fill="#fa87e2"/>
</svg>


